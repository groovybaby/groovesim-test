<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GrooveSim iPhone diagnostic</title><style>body{font:17px -apple-system,Arial,sans-serif;background:#101b2a;color:#fff;padding:18px;line-height:1.5}button{font-size:18px;padding:14px;margin:10px 4px;background:#f9ce4c;border:0;border-radius:8px}#box{width:120px;height:80px;background:#3789c5;touch-action:none;border-radius:8px;display:grid;place-items:center}canvas{background:white;width:300px;max-width:100%;height:110px}strong{color:#9ff5a3}</style></head><body><h2>GrooveSim – iPhone test</h2><p>This checks whether the viewer runs JavaScript, animation, touch controls and audio.</p><p id="js">JavaScript: <b style="color:#ff8b8b">NOT RUNNING</b></p><p id="counter">Clock: not started</p><canvas id="canvas" width="300" height="110"></canvas><p>Drag this blue box with your finger:</p><div id="box">Drag me</div><p id="touch">Touch: waiting</p><button id="sound">Play test tone</button><p id="audio">Audio: waiting</p><p id="info"></p><script>
(()=>{const q=x=>document.getElementById(x);q('js').innerHTML='JavaScript: <strong>RUNNING ✓</strong>';q('info').textContent='Browser: '+navigator.userAgent;let start=performance.now();let c=q('canvas').getContext('2d');function frame(t){let elapsed=(t-start)/1000;q('counter').textContent='Clock: '+elapsed.toFixed(1)+' seconds';c.clearRect(0,0,300,110);c.strokeStyle='#1470bd';c.lineWidth=2;c.beginPath();for(let x=0;x<300;x++){let y=55+28*Math.sin((x/300)*Math.PI*8-elapsed*3);if(x===0)c.moveTo(x,y);else c.lineTo(x,y)}c.stroke();requestAnimationFrame(frame)}requestAnimationFrame(frame);let box=q('box'),ox=0,oy=0;box.addEventListener('pointerdown',e=>{box.setPointerCapture(e.pointerId);ox=e.clientX-box.getBoundingClientRect().left;oy=e.clientY-box.getBoundingClientRect().top;q('touch').textContent='Touch: detected ✓'});box.addEventListener('pointermove',e=>{if(!box.hasPointerCapture(e.pointerId))return;box.style.position='fixed';box.style.left=Math.max(0,e.clientX-ox)+'px';box.style.top=Math.max(0,e.clientY-oy)+'px';q('touch').textContent='Touch: moving ✓'});q('sound').addEventListener('click',async()=>{try{let A=window.AudioContext||window.webkitAudioContext;if(!A)throw Error('Web Audio not available');let a=new A();await a.resume();let o=a.createOscillator(),g=a.createGain();o.frequency.value=440;g.gain.value=.12;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.5);q('audio').textContent='Audio: tone requested ✓ (you should hear a beep)';o.onended=()=>a.close()}catch(e){q('audio').textContent='Audio error: '+e.message}})})();
</script></body></html>
